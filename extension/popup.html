<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Home Anchor</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="icons/icon-48.png" alt="" width="32" height="32" />
    <h1>Home Anchor</h1>
  </header>

  <section id="login" hidden>
    <p class="tagline">Sign in to see today's chores.</p>
    <form id="login-form">
      <input id="email" type="email" placeholder="Email" autocomplete="username" required />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit" class="primary">Sign in</button>
    </form>
  </section>

  <section id="chores" hidden>
    <h2>Today's chores</h2>
    <ul id="chore-list"></ul>
    <p id="empty" hidden>Nothing to do today. 🎉</p>
  </section>

  <p id="status" role="status" aria-live="polite"></p>

  <hr />
  <button id="open-app" class="primary">Open dashboard</button>
  <button id="open-new-tab">Open in new tab</button>
  <button id="copy-link">Copy app link</button>
  <button id="sign-out" hidden>Sign out</button>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
